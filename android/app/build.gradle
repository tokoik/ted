plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.ted_openxr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.ted_openxr"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1+"
        }
    }

    ndkVersion "27.0.12077973"
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
